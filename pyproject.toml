[project]
name = "alphawallets"
version = "0.1.0"
description = "On-chain analytics for identifying consistently profitable wallets on Ethereum and Base"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ioannis Veroulis", email = "john.veroulis@gmail.com" }]
keywords = ["ethereum", "base", "on-chain", "analytics", "alchemy", "defi"]

dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/JohanVeroulis/alphawallets"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphawallets"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["alphawallets"]

[tool.ruff.format]
# Defaults are Black-compatible: double quotes, spaces, magic trailing comma respected.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than a second (deselect with -m 'not slow')",
    "integration: tests that hit the live Dune API (deselected by default)",
]

[tool.coverage.run]
source = ["src/alphawallets"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
